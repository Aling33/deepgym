<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DeepGym - Todos</title>
<style>
  body { margin: 0; font: 16px system-ui, sans-serif; background: #f6f5f1; color: #222; }
  main { width: 520px; margin: 50px auto; }
  h1 { font-size: 26px; margin: 0 0 18px; }
  .new { display: flex; gap: 8px; }
  .new input { flex: 1; height: 40px; padding: 0 12px; font-size: 16px; border: 1px solid #bbb;
               border-radius: 6px; }
  .new button { width: 90px; height: 42px; font-size: 16px; border: 0; border-radius: 6px;
                background: #16a34a; color: #fff; cursor: pointer; }
  ul { list-style: none; padding: 0; margin: 20px 0 0; }
  li { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 12px; background: #fff;
       border: 1px solid #e3e1da; border-radius: 6px; margin-bottom: 8px; }
  li input { width: 20px; height: 20px; }
  li span { flex: 1; }
  li.done span { text-decoration: line-through; color: #888; }
  li button { width: 32px; height: 32px; border: 0; background: #fee2e2; color: #b91c1c;
              border-radius: 6px; font-size: 18px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>My todos</h1>
  <form class="new" id="form">
    <input id="text" placeholder="What needs doing?" autocomplete="off">
    <button type="submit">Add</button>
  </form>
  <ul id="list"></ul>
</main>
<script>
  const items = [
    { text: 'Buy milk', done: false },
    { text: 'Call mom', done: false },
    { text: 'Write report', done: false },
  ];
  // Chain saves so they reach the server in the order the changes happened,
  // and keep chaining even if one save fails.
  let saving = Promise.resolve();
  const save = () => {
    const body = JSON.stringify({ items });
    const send = () => fetch('/api/state', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body,
    });
    saving = saving.then(send, send);
  };
  const render = () => {
    const list = document.getElementById('list');
    list.replaceChildren(...items.map((item, i) => {
      const li = document.createElement('li');
      li.className = item.done ? 'done' : '';
      const box = Object.assign(document.createElement('input'), { type: 'checkbox', checked: item.done });
      box.setAttribute('aria-label', `Mark ${item.text} done`);
      box.onchange = () => { item.done = box.checked; render(); save(); };
      const text = Object.assign(document.createElement('span'), { textContent: item.text });
      const del = Object.assign(document.createElement('button'), { textContent: '×', title: `Delete ${item.text}` });
      del.onclick = () => { items.splice(i, 1); render(); save(); };
      li.append(box, text, del);
      return li;
    }));
  };
  document.getElementById('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('text');
    if (!input.value.trim()) return;
    items.push({ text: input.value.trim(), done: false });
    input.value = '';
    render();
    save();
  });
  render();
</script>
</body>
</html>
